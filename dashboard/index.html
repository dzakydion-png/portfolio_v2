<!DOCTYPE html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/styles.min.css" />
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg" />
    <title>Messages Dashboard</title>
  </head>

  <body class="body-wrap">
    <div class="cursor-effect"></div>

    <div class="content">
      <section class="contact">
        <div class="contact-title">
          <h5>— dashboard</h5>
          <h2>Messages</h2>
        </div>

        <div class="container">
          <div class="sub">
            Admin dashboard. Enter your admin token to load messages.
          </div>

          <p>
            <a href="../index.html">Back to home</a>
          </p>

          <div class="input-row">
            <div class="side">
              <label for="admin-token">Admin Token</label>
              <input
                id="admin-token"
                name="admin-token"
                type="password"
                placeholder="Enter admin token"
                autocomplete="current-password"
              />
            </div>
          </div>
          <button type="button" id="login">Load messages</button>
          <button type="button" id="logout">Logout</button>
          <p id="status" aria-live="polite"></p>

          <p id="empty" style="display: none">No messages.</p>
          <div id="messages"></div>
        </div>
      </section>

      <footer class="footer">
        <hr />
        <div class="footer-copy">&copy; Dzaky Dion Haidar 2026</div>
      </footer>
    </div>

    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>
    <script src="../assets/js/dashboard.js?v=1"></script>
  </body>
</html>
